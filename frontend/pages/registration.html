<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Customer Registration - CreditFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        CreditFlow
    </div>

    <nav>

        <a href="../index.html">
            Dashboard
        </a>

        <a href="registration.html" class="active">
            Registration
        </a>

        <a href="customers.html">
            Customers
        </a>

        <a href="loans.html">
            Loans
        </a>

        <a href="repayments.html">
            Repayments
        </a>

    </nav>

</header>


<main class="form-page">

    <div class="form-container">

        <div class="page-heading">
            <h1>Customer Registration</h1>
            <p>Enter the customer's personal and employment information.</p>
        </div>


        <form id="registrationForm">

            <h2>Personal Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="name">Full Name</label>
                    <input type="text" id="name" required>
                </div>

                <div class="form-group">
                    <label for="dob">Date of Birth</label>
                    <input type="date" id="dob" required>
                </div>

                <div class="form-group">
                    <label for="phone">Phone Number</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label for="password">Password</label>
                    <input type="password" id="password" minlength="8" autocomplete="new-password" required>
                </div>

            </div>


            <div class="form-group">
                <label for="address">Address</label>
                <textarea id="address" rows="3" required></textarea>
            </div>

            <div class="form-group">
                <label for="city">City</label>
                <input type="text" id="city" maxlength="80" required>
            </div>


            <h2>Employment Information</h2>

            <div class="form-grid">

                <div class="form-group">
                    <label for="employment">Employment Type</label>

                    <select id="employment" required>
                        <option value="">Select employment type</option>
                        <option value="SALARIED">Salaried</option>
                        <option value="SELF_EMPLOYED">Self Employed</option>
                        <option value="BUSINESS">Business Owner</option>
                        <option value="OTHER">Other</option>
                    </select>
                </div>


                <div class="form-group">
                    <label for="employer">Employer / Organization</label>
                    <input type="text" id="employer" required>
                </div>


                <div class="form-group">
                    <label for="income">Monthly Income (₹)</label>
                    <input type="number" id="income" min="0" required>
                </div>


                <div class="form-group">
                    <label for="experience">Years of Employment</label>
                    <input type="number" id="experience" min="0" step="0.1" required>
                </div>

            </div>

            <h2>Identity Information</h2>

            <div class="form-grid">
                <div class="form-group">
                    <label for="panNumber">PAN Number</label>
                    <input type="text" id="panNumber" maxlength="10" autocomplete="off" required>
                </div>

                <div class="form-group">
                    <label for="aadhaarLast4">Aadhaar last four digits</label>
                    <input type="text" id="aadhaarLast4" inputmode="numeric" minlength="4" maxlength="4" pattern="[0-9]{4}" autocomplete="off" required>
                </div>
            </div>

            <p id="formMessage" role="alert" aria-live="polite"></p>


            <div class="button-container">

                <a href="../index.html" class="secondary-button">
                    Cancel
                </a>

                <button type="submit" class="primary-button">
                    Continue to Loan Application
                </button>

            </div>

        </form>

    </div>

</main>


<script src="../js/api.js"></script>
<script src="../js/registration.js"></script>

</body>
</html>
