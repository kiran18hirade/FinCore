<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Loan Application - CreditFlow</title>
    <link rel="stylesheet" href="../css/style.css">
</head>

<body>

<header class="navbar">

    <div class="logo">
        CreditFlow
    </div>

    <nav>

        <a href="../index.html">
            Dashboard
        </a>

        <a href="registration.html">
            Registration
        </a>

        <a href="customers.html">
            Customers
        </a>

        <a href="loans.html" class="active">
            Loans
        </a>

        <a href="repayments.html">
            Repayments
        </a>

    </nav>

</header>


<main class="form-page">

    <div class="form-container">

        <div class="page-heading">

            <h1>Loan Application</h1>

            <p>
                Enter loan and credit information for the customer.
            </p>

        </div>


        <div class="customer-summary">

            <h3>Customer</h3>

            <p>
                <strong>Name:</strong>
                <span id="customerName"></span>
            </p>

            <p>
                <strong>Customer ID:</strong>
                <span id="customerId"></span>
            </p>

        </div>


        <form id="loanForm">

            <h2>Loan Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label for="loanAmount">
                        Loan Amount (₹)
                    </label>

                    <input
                        type="number"
                        id="loanAmount"
                        min="1"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loanTenure">Loan Tenure (Months)</label>

                    <input
                        type="number"
                        id="loanTenure"
                        min="6"
                        max="360"
                        required
                    >

                </div>


                <div class="form-group">

                    <label for="loanTypeId">Loan Product</label>

                    <select id="loanTypeId" required>

                        <option value="">Loading loan products...</option>

                    </select>

                </div>


                <div class="form-group">

                    <label for="loanPurpose">Loan Purpose</label>

                    <select id="loanPurpose" required>
                        <option value="">Select purpose</option>
                        <option value="Education">Education</option>
                        <option value="Home">Home</option>
                        <option value="Vehicle">Vehicle</option>
                        <option value="Personal">Personal</option>
                        <option value="Business">Business</option>
                    </select>

                </div>


                <div class="form-group">

                    <label for="existingEmi">Existing Monthly EMI (₹)</label>

                    <input
                        type="number"
                        id="existingEmi"
                        min="0"
                        step="0.01"
                        required
                    >

                </div>

            </div>


            <h2>Credit Information</h2>

            <div class="form-grid">

                <div class="form-group">

                    <label for="creditScore">
                        Credit Score
                    </label>

                    <input
                        type="number"
                        id="creditScore"
                        min="300"
                        max="900"
                        required
                    >

                </div>


            </div>

            <p id="formMessage" role="alert" aria-live="polite"></p>


            <div class="button-container">

                <a href="registration.html"
                   class="secondary-button">
                    Back
                </a>

                <button
                    type="submit"
                    class="primary-button">
                    Submit Application
                </button>

            </div>

        </form>

    </div>

</main>


<script src="../js/api.js"></script>
<script src="../js/loan-application.js"></script>

</body>
</html>
